services:
  frugaast-web:
    build:
      context: ../
      dockerfile: docker/dockerfile-react
      target: final_image
    image: frugaast-website-prod
    container_name: frugaast-web
    restart: always

    environment:
      - NODE_ENV=production

    volumes:
      - ${PWD}/../.env.local:/app/.env.local
    ports:
      - 3007:3000
    working_dir: /app
    
    entrypoint: "npm run start"

    # NODE_OPTIONS="--inspect=0.0.0.0:9229" npm run dev


  frugaast-api:
    build: 
      context: ../
      dockerfile: docker/dockerfile-python
    container_name: frugaast-api
    restart: unless-stopped
    volumes:
      - ${PWD}/../api:/app
      - ${PWD}/../.env.local:/app/.env.local
      - ${PWD}/../keys:/keys
    ports:
      - 4242:4242
    env_file:
      - ../.env.local
    entrypoint: ["gunicorn", "--bind", "0.0.0.0:4242", "app:app"] 